  :root {

    --text: #0F172A;

    --total-bg: #F8FAFC;
    --divider: #E2E8F0;
    --alert-bg: #FEF2F2;
    --alert-border: #FECACA;
    --alert-strong: #B91C1C;
    --alert-soft: #7F1D1D;
    --avatar-bg: #DBEAFE;
    --safe-top: 0px;
    --safe-bottom: 0px;

  body.dark {
    --bg: #0B1220;
    --text: #F1F5F9;
    --muted: #94A3B8;

  body {

  @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .btn:active { transform: translateY(0) scale(.97); }
  .btn:disabled { opacity: .6; cursor: default; transform:none !important; }

<script>
"use strict";

// ---- Local storage (on-device) ----
var STORE_KEY = "qarzDaftarchaCustomers";

var BLUE = "#2F6FED", BLUE_DARK = "#1E4FBF";

var state = {
  view: "list",
  theme: localStorage.getItem("qd_theme") || "light",
  lang: localStorage.getItem("qd_lang") || "uz",
  filter: "all",
  reminderDays: Number(localStorage.getItem("qd_reminderDays")) || 0,
  customers: [],
  loading: true,
  loadError: null,
  showForm: false,
  saving: false,
  search: "",
  payingId: null,
  payAmount: "",
  expandedId: null,
  toast: null,
  fName: "",
  fPhone: "",
  fDue: "",
  fPhoto: null,
  formItems: [],
  deferredPrompt: null,
  showInstallBanner: false
};

document.body.classList.toggle("dark", state.theme === "dark");

// ---- Telegram Mini App integration ----
var tg = window.Telegram && window.Telegram.WebApp;

function applyChromeColors() {
  var isDark = state.theme === "dark";
  if (tg) {
    try { tg.setHeaderColor(isDark ? "#0B1220" : "#2F6FED"); } catch (e) {}
    try { tg.setBackgroundColor(isDark ? "#0B1220" : "#FFFFFF"); } catch (e) {}
    try { tg.setBottomBarColor(isDark ? "#0B1220" : "#FFFFFF"); } catch (e) {}
  }
}

function applySafeArea() {
  if (!tg) return;
  var sa = tg.safeAreaInset || {};
  var csa = tg.contentSafeAreaInset || {};
  var top = Math.max(sa.top || 0, csa.top || 0);
  var bottom = Math.max(sa.bottom || 0, csa.bottom || 0);
  document.documentElement.style.setProperty("--safe-top", top + "px");
  document.documentElement.style.setProperty("--safe-bottom", bottom + "px");
}

function syncTelegramUI() {
  if (!tg) return;
  // Back button: shown whenever the user is somewhere other than the main list
  var showBack = state.view === "settings" || state.showForm || state.payingId;
  if (showBack) tg.BackButton.show(); else tg.BackButton.hide();

  // Main button: quick "add debt" on the list view, becomes "Save" while the form is open
  if (state.showForm) {
    tg.MainButton.setParams({
      text: state.saving ? t("savingBtn") : t("saveDebtBtn"),
      color: "#2F6FED",
      text_color: "#FFFFFF",
      is_active: !state.saving,
      is_visible: true
    });
    if (state.saving) tg.MainButton.showProgress(false); else tg.MainButton.hideProgress();
  } else if (state.view === "list" && !state.payingId) {
    tg.MainButton.setParams({ text: t("newDebtTitle"), color: "#2F6FED", text_color: "#FFFFFF", is_active: true, is_visible: true });
    tg.MainButton.hideProgress();
  } else {
    tg.MainButton.hide();
  }
}

if (tg) {
  tg.ready();
  tg.expand();
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  applyChromeColors();
  applySafeArea();

  tg.onEvent("backButtonClicked", function () {
    if (state.payingId) cancelPayment();
    else if (state.showForm) closeForm();
    else if (state.view === "settings") goList();
  });
  tg.onEvent("mainButtonClicked", function () {
    if (state.showForm) submitForm();
    else if (state.view === "list") openForm();
  });
  tg.onEvent("viewportChanged", applySafeArea);
  tg.onEvent("themeChanged", applyChromeColors);
}

    alertLineSuffix: function(status, dd){
      if (status === "today") return "(сегодня)";
      if (status === "overdue") return "(просрочено на " + Math.abs(dd) + " дн.)";
      return "(осталось " + dd + " дн.)";
    },
    smsTemplate: function(name, amount){ return "Здравствуйте, " + name + "! У вас есть долг " + fmtMoney(amount) + " " + t("currency") + ". Пожалуйста, оплатите при возможности. Спасибо!"; }
  }
};
function t(key, arg) {
  var dict = LANG[state.lang] || LANG.uz;
  var v = dict[key];
  if (typeof v === "function") return v(arg);
  return v;
}

function fmtDate(d) {
  if (!d) return "-";
  var dt = new Date(d + "T00:00:00");
  var monthsUz = ["Yan","Fev","Mar","Apr","May","Iyun","Iyul","Avg","Sen","Okt","Noy","Dek"];
  var monthsRu = ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  var months = state.lang === "ru" ? monthsRu : monthsUz;
  return dt.getDate() + " " + months[dt.getMonth()] + ", " + dt.getFullYear();
}
function daysDiff(dueDate) {
  var a = new Date(todayStr() + "T00:00:00");
  var b = new Date(dueDate + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

function showToast(msg) {
  state.toast = msg;
  render();
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function () { state.toast = null; render(); }, 2400);
}

function saveCustomers() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state.customers));
    return true;
  } catch (err) {
    return false;
  }
}

function loadCustomers() {
  state.loading = true;
  state.loadError = null;
  try {
    var stored = localStorage.getItem(STORE_KEY);
    state.customers = stored ? JSON.parse(stored) : [];
    state.loading = false;
    render();
  } catch (err) {
    state.loading = false;
    state.loadError = "Ma'lumotlarni o'qib bo'lmadi";
    render();
  }
}

function enrich(c) {
  var total = c.items.reduce(function (s, it) { return s + Number(it.price) * Number(it.qty); }, 0);
  var paid = (c.payments || []).reduce(function (s, p) { return s + Number(p.amount); }, 0);
  var remaining = Math.max(total - paid, 0);
  var isPaid = remaining <= 0;
  var dd = c.dueDate ? daysDiff(c.dueDate) : null;
  var status = "upcoming";
  if (isPaid) status = "paid";
  else if (dd !== null && dd < 0) status = "overdue";
  else if (dd !== null && dd === 0) status = "today";
  var out = Object.assign({}, c);
  out.total = total; out.paid = paid; out.remaining = remaining; out.isPaid = isPaid; out.dd = dd; out.status = status;
  return out;
}

function getFiltered() {
  var enrichedList = state.customers.map(enrich);
  var q = state.search.trim().toLowerCase();
  var list = enrichedList;
  if (q) {
    list = list.filter(function (c) {
      return c.name.toLowerCase().indexOf(q) !== -1 || (c.phone || "").indexOf(q) !== -1;
    });
  }
  if (state.filter === "debt") list = list.filter(function (c) { return !c.isPaid; });
  if (state.filter === "paid") list = list.filter(function (c) { return c.isPaid; });
  var order = { overdue: 0, today: 1, upcoming: 2, paid: 3 };
  return list.slice().sort(function (a, b) {
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    if (a.dueDate && b.dueDate) return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0);
    return 0;
  });
}

function getAlerts() {
  return state.customers.map(enrich).filter(function (c) {
    if (c.isPaid) return false;
    if (c.status === "overdue" || c.status === "today") return true;
    if (state.reminderDays > 0 && c.dd !== null && c.dd > 0 && c.dd <= state.reminderDays) return true;
    return false;
  });
}

function getTotalOutstanding() {
  return state.customers.map(enrich).reduce(function (s, c) { return s + c.remaining; }, 0);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}

function badgeHtml(status, dd) {
  var map = {
    paid: { bg: "#DCFCE7", color: "#15803D", text: t("paidLabel") },
    overdue: { bg: "#FEE2E2", color: "#DC2626", text: t("overdueBadge", Math.abs(dd)) },
    today: { bg: "#FEF3C7", color: "#B45309", text: t("todayBadge") },
    upcoming: { bg: "#DBEAFE", color: BLUE_DARK, text: dd !== null ? t("upcomingBadge", dd) : t("noDueDate") }
  };
  var s = map[status] || map.upcoming;
  return '<span class="badge" style="background:' + s.bg + ';color:' + s.color + '">' + s.text + '</span>';
}

  }

  if (state.view === "settings") {

          html += '<div style="display:flex;gap:8px">';
          html += '<input class="form-input" style="margin-bottom:0" type="number" placeholder="' + t("amountPlaceholder") + '" data-input="payAmount" value="' + escapeHtml(state.payAmount) + '"/>';
          html += '<button class="btn small-blue" data-action="submit-payment" data-id="' + c.id + '" ' + (state.saving ? "disabled" : "") + '>' + (state.saving ? '<span class="spinner"></span>' : icon("check", 15, "#fff")) + '</button>';
          html += '<button class="btn small-gray" data-action="cancel-payment">' + icon("x", 15, "var(--muted)") + '</button>';
          html += '</div>';
        } else {
          html += '<div style="display:flex;gap:8px">';
          html += '<button class="btn pay-btn" data-action="start-payment" data-id="' + c.id + '">' + t("acceptPaymentBtn") + '</button>';
          html += '<button class="btn delete-btn" data-action="remove-customer" data-id="' + c.id + '">' + icon("trash", 15, "#DC2626") + '</button>';
          html += '</div>';
        }
        html += '</div>';
      } else {
        html += '<button class="btn delete-btn" style="margin-top:12px" data-action="remove-customer" data-id="' + c.id + '">' + icon("trash", 14, "#DC2626") + " " + t("deleteBtn") + "</button>";
      }
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';

  html += renderBottomNav();

  if (state.showForm) {
    var formTotal = state.formItems.reduce(function (s, it) { return s + (Number(it.price) || 0) * (Number(it.qty) || 0); }, 0);
    html += '<div class="overlay" data-action="close-form-overlay">';
    html += '<div class="modal modal-wrap" data-stop="1">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
    html += '<span style="font-weight:800;font-size:17px;color:var(--text)">' + t("newDebtTitle") + '</span>';
    html += '<button style="background:none;border:none;cursor:pointer" data-action="close-form">' + icon("x", 20, "var(--muted)") + '</button>';
    html += '</div>';
    html += '<div class="form-scroll">';

    html += '<label class="label">' + t("customerPhotoLabel") + '</label>';
    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">';
    if (state.fPhoto) {
      html += '<img src="' + state.fPhoto + '" style="width:52px;height:52px;border-radius:12px;object-fit:cover;border:1px solid var(--input-border)"/>';
    } else {
      html += '<div style="width:52px;height:52px;border-radius:12px;background:var(--search-bg);display:flex;align-items:center;justify-content:center;color:var(--muted2)">' + icon("camera", 20) + '</div>';
    }
    html += '<button type="button" class="btn add-row-btn photo-picker-label" style="margin-top:0" data-action="open-camera">' + icon("camera", 13, "#1E4FBF") + ' <span>Kamera</span></button>';
    html += '<label class="btn add-row-btn photo-picker-label" style="margin-top:0">' + icon("image", 13, "#1E4FBF") + ' <span>Galereya</span><input type="file" accept="image/*" id="photo-input" style="display:none"/></label>';
    html += '<input type="file" id="camera-input" accept="image/*" style="display:none">';
    if (state.fPhoto) html += '<button data-action="remove-photo" style="background:none;border:none;cursor:pointer">' + icon("x", 16, "var(--muted2)") + '</button>';
    html += '</div>';

    html += '<label class="label">' + t("customerNameLabel") + '</label><input class="form-input" data-input="fName" placeholder="' + t("namePlaceholder") + '" value="' + escapeHtml(state.fName) + '"/>';
    html += '<label class="label">' + t("phoneLabel") + '</label><input class="form-input" data-input="fPhone" placeholder="+998 90 123 45 67" value="' + escapeHtml(state.fPhone) + '"/>';
    html += '<label class="label">' + t("duedateLabel") + '</label><input class="form-input" type="date" data-input="fDue" value="' + escapeHtml(state.fDue) + '"/>';
    html += '<label class="label">' + t("itemsLabel") + '</label>';
    state.formItems.forEach(function (it) {
      html += '<div style="display:flex;gap:6px;margin-bottom:6px">';
      html += '<input class="form-input" style="flex:2;margin-bottom:0" placeholder="' + t("itemNamePh") + '" data-input="itemName" data-id="' + it.id + '" value="' + escapeHtml(it.name) + '"/>';
      html += '<input class="form-input" style="flex:1.3;margin-bottom:0" type="number" placeholder="' + t("pricePh") + '" data-input="itemPrice" data-id="' + it.id + '" value="' + escapeHtml(it.price) + '"/>';
      html += '<input class="form-input" style="flex:0.8;margin-bottom:0" type="number" placeholder="' + t("qtyPh") + '" data-input="itemQty" data-id="' + it.id + '" value="' + escapeHtml(it.qty) + '"/>';
      html += '<button style="background:none;border:none;cursor:pointer;padding:0 2px" data-action="remove-item-row" data-id="' + it.id + '">' + icon("x", 16, "var(--muted2)") + '</button>';
      html += '</div>';
    });
    html += '<button class="btn add-row-btn" data-action="add-item-row">' + icon("plus", 13, "#1E4FBF") + " " + t("addItemBtn") + "</button>";
    html += '<div class="total-box"><span style="color:var(--muted);font-size:13.5px">' + t("totalSumLabel") + '</span><span class="form-total-value" style="font-weight:800;font-size:17px;color:' + BLUE + '">' + fmtMoney(formTotal) + " " + t("currency") + '</span></div>';
    html += '</div>';
    html += '<button class="btn submit-btn" data-action="submit-form" ' + (state.saving ? "disabled" : "") + '>' + (state.saving ? '<span class="spinner"></span> ' + t("savingBtn") : t("saveDebtBtn")) + '</button>';
    html += '</div></div>';
  }

  if (state.toast) {
    html += '<div class="toast">' + escapeHtml(state.toast) + '</div>';
  }

  document.getElementById("app").innerHTML = html;
  syncTelegramUI();
}

// ---- actions ----
function goList() { state.view = "list"; render(); }
function goSettings() { state.view = "settings"; render(); }

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  localStorage.setItem("qd_theme", state.theme);
  document.body.classList.toggle("dark", state.theme === "dark");
  applyChromeColors();
  render();
}

function setLang(lang) {
  if (lang !== "uz" && lang !== "ru") return;
  state.lang = lang;
  localStorage.setItem("qd_lang", lang);
  document.documentElement.setAttribute("lang", lang);
  render();
}

function setFilter(f) { state.filter = f; render(); }

function exportData() {
  var dataStr = JSON.stringify(state.customers, null, 2);
  var blob = new Blob([dataStr], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "qarz-daftarcha-export.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(t("toastExported"));
}

function clearPaid() {
  var paidIds = state.customers.map(enrich).filter(function (c) { return c.isPaid; }).map(function (c) { return c.id; });
  if (paidIds.length === 0) { alert(t("alertNoPaid")); return; }
  if (!confirm(t("confirmClearPaid", paidIds.length))) return;
  state.customers = state.customers.filter(function (c) { return paidIds.indexOf(c.id) === -1; });
  saveCustomers();
  render();
  showToast(t("toastCleared"));
}

function openForm() {
  state.showForm = true;
  state.fName = ""; state.fPhone = ""; state.fDue = ""; state.fPhoto = null;
  state.formItems = [{ id: uid(), name: "", price: "", qty: "1" }];
  render();
}
function closeForm() { if (state.saving) return; state.showForm = false; render(); }
function addItemRow() { state.formItems.push({ id: uid(), name: "", price: "", qty: "1" }); render(); }
function removeItemRow(id) {
  if (state.formItems.length > 1) state.formItems = state.formItems.filter(function (r) { return r.id !== id; });
  render();
}
function removePhoto() { state.fPhoto = null; render(); }
function updateFormTotalDisplay() {
  var formTotal = state.formItems.reduce(function (s, it) { return s + (Number(it.price) || 0) * (Number(it.qty) || 0); }, 0);
  var el = document.querySelector(".form-total-value");
  if (el) el.textContent = fmtMoney(formTotal) + " " + t("currency");
}

function submitForm() {
  var name = (state.fName || "").trim();
  if (!name) { alert(t("alertNoName")); return; }
  var cleanItems = state.formItems
    .filter(function (it) { return it.name.trim() && Number(it.price) > 0; })
    .map(function (it) { return { id: it.id, name: it.name.trim(), price: Number(it.price), qty: Number(it.qty) || 1 }; });
  if (cleanItems.length === 0) { alert(t("alertNoItems")); return; }

  var newCustomer = {
    id: uid(),
    name: name,
    phone: (state.fPhone || "").trim(),
    dueDate: state.fDue || null,
    photo: state.fPhoto || null,
    items: cleanItems,
    payments: []
  };

  state.customers.unshift(newCustomer);
  saveCustomers();
  state.showForm = false;
  render();
  showToast(t("toastAdded"));
}

function toggleExpand(id) { state.expandedId = state.expandedId === id ? null : id; render(); }

function removeCustomer(id) {
  if (!confirm(t("confirmDeleteMsg"))) return;
  state.customers = state.customers.filter(function (c) { return c.id !== id; });
  saveCustomers();
  render();
  showToast(t("toastDeleted"));
}

function startPayment(id) { state.payingId = id; state.payAmount = ""; render(); }
function cancelPayment() { if (state.saving) return; state.payingId = null; state.payAmount = ""; render(); }

function submitPayment(id) {
  var amt = Number(state.payAmount);
  if (!amt || amt <= 0) { alert(t("alertBadAmount")); return; }
  var c = state.customers.find(function (c) { return c.id === id; });
  if (!c) return;

  c.payments = (c.payments || []).concat([{ id: uid(), amount: amt, date: todayStr() }]);
  saveCustomers();
  state.payingId = null; state.payAmount = "";
  render();
  showToast(t("toastPaymentAccepted"));
}

document.addEventListener("click", function (e) {
  var actionEl = e.target.closest("[data-action]");
  if (!actionEl) return;
  var action = actionEl.getAttribute("data-action");
  var id = actionEl.getAttribute("data-id");

  if (action === "close-form-overlay") {
    if (e.target === actionEl) closeForm();
    return;
  }

  switch (action) {
    case "go-list": goList(); break;
    case "go-settings": goSettings(); break;
    case "toggle-theme": toggleTheme(); break;
    case "set-lang": setLang(id); break;
    case "set-filter": setFilter(id); break;
    case "export-data": exportData(); break;
    case "clear-paid": clearPaid(); break;
    case "open-form": openForm(); break;
    case "close-form": closeForm(); break;
    case "add-item-row": addItemRow(); break;
    case "remove-item-row": removeItemRow(id); break;
    case "remove-photo": removePhoto(); break;
    case "open-camera": openCameraInput(); break;
    case "toggle-expand": toggleExpand(id); break;
    case "start-payment": startPayment(id); break;
    case "cancel-payment": cancelPayment(); break;
    case "submit-payment": submitPayment(id); break;
    case "remove-customer": removeCustomer(id); break;
    case "submit-form": submitForm(); break;
    case "install-app": installApp(); break;
    case "retry-load": loadCustomers(); break;
  }
});

document.addEventListener("input", function (e) {
  var el = e.target;
  var field = el.getAttribute("data-input");
  if (!field) return;
  var id = el.getAttribute("data-id");

  if (field === "search") { state.search = el.value; render(); return; }
  if (field === "fName") { state.fName = el.value; return; }
  if (field === "fPhone") { state.fPhone = el.value; return; }
  if (field === "fDue") { state.fDue = el.value; return; }
  if (field === "payAmount") { state.payAmount = el.value; return; }
  if (field === "reminderDays") {
    state.reminderDays = Math.max(0, Number(el.value) || 0);
    localStorage.setItem("qd_reminderDays", state.reminderDays);
    return;
  }
  if (field === "itemName" || field === "itemPrice" || field === "itemQty") {
    var row = state.formItems.find(function (r) { return r.id === id; });
    if (!row) return;
    if (field === "itemName") row.name = el.value;
    if (field === "itemPrice") { row.price = el.value; updateFormTotalDisplay(); }
    if (field === "itemQty") { row.qty = el.value; updateFormTotalDisplay(); }
  }
});

// ---- Direct camera capture (Chrome Android) ----
function openCameraInput() {
  var input = document.getElementById("camera-input");
  if (!input) return;
  input.value = "";
  input.click();
}

// The camera input returns a normal File after the user takes a photo.
document.addEventListener("change", function (e) {
  var el = e.target;
  if (el.id !== "camera-input") return;
  var file = el.files && el.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (ev) {
    var img = new Image();
    img.onload = function () {
      try {
        var maxW = 480;
        var scale = Math.min(1, maxW / img.width);
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        state.fPhoto = canvas.toDataURL("image/jpeg", 0.65);
        render();
      } catch (err) {
        showToast(t("toastPhotoError"));
      }
    };
    img.onerror = function () { showToast(t("toastPhotoError")); };
    img.src = ev.target.result;
  };
  reader.onerror = function () { showToast(t("toastPhotoError")); };
  reader.readAsDataURL(file);
  el.value = "";
});

// ---- PWA install ----
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  state.deferredPrompt = e;
  state.showInstallBanner = true;
});
function installApp() {
  if (!state.deferredPrompt) return;
  state.deferredPrompt.prompt();
  state.deferredPrompt.userChoice.finally(function () {
    state.deferredPrompt = null;
    state.showInstallBanner = false;
    render();
  });
}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}

document.documentElement.setAttribute("lang", state.lang);
loadCustomers();
</script>
